name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Cs2Market.sln

      - name: Build (warnings as errors)
        run: dotnet build Cs2Market.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --solution Cs2Market.sln --configuration Release --no-build

      - name: Format
        run: dotnet format Cs2Market.sln --verify-no-changes --no-restore
